name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/../vcpkg"
          git -C "${GITHUB_WORKSPACE}/../vcpkg" fetch --depth 1 origin e99d87dcf02926bfd629560e11e156329d5720c1
          git -C "${GITHUB_WORKSPACE}/../vcpkg" checkout FETCH_HEAD
          "${GITHUB_WORKSPACE}/../vcpkg/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/../vcpkg"
          git -C "$env:GITHUB_WORKSPACE/../vcpkg" fetch --depth 1 origin e99d87dcf02926bfd629560e11e156329d5720c1
          git -C "$env:GITHUB_WORKSPACE/../vcpkg" checkout FETCH_HEAD
          & "$env:GITHUB_WORKSPACE/../vcpkg/bootstrap-vcpkg.bat"

      # Ninja ジェネレータは PATH の cl.exe を使う。
      # 有効化しないと runner の MinGW が拾われ、x64-windows triplet と ABI が食い違う。
      - name: Enable MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure
        run: cmake --preset dev -DKAPPAN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev --output-on-failure
