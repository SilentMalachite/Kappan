name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            preset: dist
            exe: ""
            archive: tar.gz
          - target: macos-x86_64
            os: macos-15-intel
            preset: dist
            exe: ""
            archive: tar.gz
          - target: linux-x86_64
            os: ubuntu-22.04
            preset: dist
            exe: ""
            archive: tar.gz
          - target: windows-x86_64
            os: windows-latest
            preset: dist-windows
            exe: ".exe"
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu-22.04 の既定 GCC は 12 系で <format> が無い。glibc 2.35 を下限に
      # 保ったまま C++20 を通すため、コンパイラだけ新しいものを入れる。
      # libstdc++ は -static-libstdc++ で埋め込むので実行側に要求は増えない。
      - name: Install toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13
          echo "CC=gcc-13" >> "${GITHUB_ENV}"
          echo "CXX=g++-13" >> "${GITHUB_ENV}"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # macos-15 系の既定 Xcode 16.4 の libc++ には std::jthread が無い。
      # macOS 15 を下限に保つため、runner は 15 のまま Xcode だけ新しくする。
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          clang++ --version

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Ninja ジェネレータは PATH の cl.exe を使う。有効化しないと MinGW が拾われる。
      - name: Enable MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/../vcpkg"
          git -C "${GITHUB_WORKSPACE}/../vcpkg" fetch --depth 1 origin e99d87dcf02926bfd629560e11e156329d5720c1
          git -C "${GITHUB_WORKSPACE}/../vcpkg" checkout FETCH_HEAD
          "${GITHUB_WORKSPACE}/../vcpkg/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/../vcpkg"
          git -C "$env:GITHUB_WORKSPACE/../vcpkg" fetch --depth 1 origin e99d87dcf02926bfd629560e11e156329d5720c1
          git -C "$env:GITHUB_WORKSPACE/../vcpkg" checkout FETCH_HEAD
          & "$env:GITHUB_WORKSPACE/../vcpkg/bootstrap-vcpkg.bat"

      # x64-windows-static は依存を全て再ビルドするため、キャッシュがないと極端に遅い。
      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        with:
          path: build/dist/vcpkg_installed
          key: vcpkg-${{ matrix.target }}-e99d87dcf02926bfd629560e11e156329d5720c1-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Install
        run: cmake --install build/dist --prefix stage

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "アーカイブのバージョン: ${version}"

      # project(kappan VERSION ...) と vcpkg.json の更新漏れをここで止める。
      - name: Verify version matches tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          actual="$(stage/bin/kappan${{ matrix.exe }} --version | tr -d '[:space:]')"
          expected="${GITHUB_REF_NAME#v}"
          if [ "${actual}" != "${expected}" ]; then
            echo "タグ ${GITHUB_REF_NAME} が示すバージョン '${expected}' と、kappan --version の出力 '${actual}' が一致しません。CMakeLists.txt の project(kappan VERSION ...) と vcpkg.json の version-semver を確認してください" >&2
            exit 1
          fi
          echo "バージョン整合を確認しました: ${actual}"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="kappan-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp stage/bin/kappan "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
          ls -l "dist/${name}.tar.gz"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "kappan-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item stage/bin/kappan.exe "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
          Get-Item "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: kappan-archive-${{ matrix.target }}
          path: dist/kappan-${{ steps.ver.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kappan-archive-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          ls -l
          sha256sum kappan-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "各環境向けのアーカイブと SHA256SUMS を添付しています。導入手順は README の「インストール」節を参照してください。macOS では署名していないため、展開後に quarantine 属性の解除が必要です。" \
            artifacts/kappan-* artifacts/SHA256SUMS
