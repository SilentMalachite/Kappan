name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            preset: dist
          - target: macos-x86_64
            os: macos-15-intel
            preset: dist
          - target: linux-x86_64
            os: ubuntu-22.04
            preset: dist
          - target: windows-x86_64
            os: windows-latest
            preset: dist-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu-22.04 の既定 GCC は 12 系で <format> が無い。glibc 2.35 を下限に
      # 保ったまま C++20 を通すため、コンパイラだけ新しいものを入れる。
      # libstdc++ は -static-libstdc++ で埋め込むので実行側に要求は増えない。
      - name: Install toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13
          echo "CC=gcc-13" >> "${GITHUB_ENV}"
          echo "CXX=g++-13" >> "${GITHUB_ENV}"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # macos-15 系の既定 Xcode 16.4 の libc++ には std::jthread が無い。
      # macOS 15 を下限に保つため、runner は 15 のまま Xcode だけ新しくする。
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          clang++ --version

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Ninja ジェネレータは PATH の cl.exe を使う。有効化しないと MinGW が拾われる。
      - name: Enable MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/../vcpkg"
          git -C "${GITHUB_WORKSPACE}/../vcpkg" fetch --depth 1 origin e99d87dcf02926bfd629560e11e156329d5720c1
          git -C "${GITHUB_WORKSPACE}/../vcpkg" checkout FETCH_HEAD
          "${GITHUB_WORKSPACE}/../vcpkg/bootstrap-vcpkg.sh"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/../vcpkg"
          git -C "$env:GITHUB_WORKSPACE/../vcpkg" fetch --depth 1 origin e99d87dcf02926bfd629560e11e156329d5720c1
          git -C "$env:GITHUB_WORKSPACE/../vcpkg" checkout FETCH_HEAD
          & "$env:GITHUB_WORKSPACE/../vcpkg/bootstrap-vcpkg.bat"

      # x64-windows-static は依存を全て再ビルドするため、キャッシュがないと極端に遅い。
      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        with:
          path: build/dist/vcpkg_installed
          key: vcpkg-${{ matrix.target }}-e99d87dcf02926bfd629560e11e156329d5720c1-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Install
        run: cmake --install build/dist --prefix stage

      - uses: actions/upload-artifact@v4
        with:
          name: kappan-${{ matrix.target }}
          path: stage/
